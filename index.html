<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0703">
<title>Video Call — Contacts</title>
<style>
:root{
  --bg:#0d0703; --panel:#1e1208; --panel2:#2b1608; --line:#3d2412;
  --accent:#f5c542; --danger:#e05252; --success:#2ecc71;
  --text:#f4ede0; --muted:#a89782;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none}
.screen{position:fixed;inset:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
[hidden]{display:none !important}
button{font-family:inherit;cursor:pointer}

/* LOBBY & CONTACTS */
#lobby{
  background: radial-gradient(ellipse at 50% 0%, rgba(245,197,66,.18), transparent 60%),
              radial-gradient(ellipse at 50% 100%, rgba(232,138,58,.15), transparent 60%),
              linear-gradient(160deg, #2b1608 0%, #150b04 50%, #0d0703 100%);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  align-items:center;
}
.header{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-size:20px;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#fff2c0,#f5c542);-webkit-background-clip:text;background-clip:text;color:transparent}
.user-badge{font-size:12px;color:var(--accent);background:rgba(245,197,66,.12);padding:5px 12px;border-radius:20px;border:1px solid rgba(245,197,66,.3);display:flex;align-items:center;gap:6px}

.preview-card{
  width:100%;max-width:440px;height:140px;border-radius:18px;overflow:hidden;
  position:relative;background:#180d05;border:1px solid rgba(245,197,66,.25);
  box-shadow:0 8px 24px rgba(0,0,0,.5);margin-bottom:16px;display:flex;align-items:center;justify-content:center;
}
#previewVideo{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
#previewVideo.on{display:block}
.preview-hint{color:var(--muted);font-size:13px;font-weight:600}

.contacts-wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.section-title{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:800;margin-bottom:2px}
.contact-card{
  background:rgba(43,22,8,.75);backdrop-filter:blur(10px);
  border:1px solid rgba(245,197,66,.2);border-radius:16px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .15s;
}
.contact-info{display:flex;align-items:center;gap:12px}
.contact-avatar{
  width:42px;height:42px;border-radius:50%;background:#381d09;
  border:1px solid rgba(245,197,66,.4);display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--accent);font-weight:800;
}
.contact-name{font-size:15px;font-weight:700;color:#fff}
.contact-status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:#666}
.dot.online{background:var(--success);box-shadow:0 0 6px var(--success)}

.call-btn{
  background:linear-gradient(180deg,#2ecc71,#27ae60);
  border:0;color:#fff;padding:8px 16px;border-radius:12px;
  font-size:13px;font-weight:800;letter-spacing:.5px;
  box-shadow:0 4px 12px rgba(46,204,113,.4);display:flex;align-items:center;gap:6px;
}
.call-btn:active{transform:scale(.95)}

#nameModal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;z-index:99;padding:20px;
}
.modal-box{
  background:linear-gradient(160deg,#2b1608,#150b04);
  border:1px solid rgba(245,197,66,.35);border-radius:22px;
  padding:26px 20px;width:100%;max-width:340px;text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.8);
}
.modal-box h2{font-size:20px;margin-bottom:8px;color:#fff2c0}
.modal-box p{font-size:13px;color:var(--muted);margin-bottom:18px}
.modal-input{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(245,197,66,.3);
  background:rgba(0,0,0,.5);color:#fff;font-size:15px;outline:none;text-align:center;font-weight:600;margin-bottom:16px;
}
.modal-input:focus{border-color:var(--accent)}
.submit-btn{
  width:100%;background:linear-gradient(180deg,#f7d67a,#e3b64c 50%,#a8760f);
  color:#2b1608;border:0;padding:12px;border-radius:12px;font-size:14px;font-weight:900;text-transform:uppercase;
}

.call-dialog{
  position:fixed;inset:0;background:rgba(10,5,2,.92);backdrop-filter:blur(14px);
  display:flex;flex-direction:column;align-items:center;justify-content:space-around;
  z-index:95;padding:calc(40px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
}
.caller-photo{
  width:110px;height:110px;border-radius:50%;background:#2b1608;
  border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:46px;box-shadow:0 0 30px rgba(245,197,66,.3);animation:pulseRing 2s infinite;
}
@keyframes pulseRing{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.caller-title{font-size:22px;font-weight:800;color:#fff;margin-top:16px;text-align:center}
.caller-subtitle{font-size:14px;color:var(--muted);margin-top:4px}
.dialog-actions{display:flex;gap:40px;align-items:center}
.circle-btn{
  width:68px;height:68px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;border:0;color:#fff;font-weight:800;gap:2px;font-size:11px;
}
.btn-accept{background:#2ecc71;box-shadow:0 8px 24px rgba(46,204,113,.5)}
.btn-reject{background:#e05252;box-shadow:0 8px 24px rgba(224,82,82,.5)}
.circle-btn .ic{font-size:26px;line-height:1}

/* ACTIVE CALL SCREEN */
#call{background:#000}
#remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
#remotePlaceholder{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background:radial-gradient(circle,#241206 0%,#000 80%);z-index:2;
}

.pip-wrap{
  position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;
  width:110px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;
  border:2px solid rgba(245,197,66,.5);box-shadow:0 8px 24px rgba(0,0,0,.8);
  background:#1a0f08;z-index:10;touch-action:none;cursor:grab;
}
.pip-wrap.hidden{transform:translateX(140px);opacity:0;pointer-events:none}
.pip-wrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);pointer-events:none}
.pip-hide{
  position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;
  border:1px solid rgba(245,197,66,.4);background:rgba(0,0,0,.6);color:#f5c542;
  font-size:14px;font-weight:900;display:grid;place-items:center;
}
.pip-show{
  position:absolute;top:calc(14px + env(safe-area-inset-top));right:0;z-index:11;
  background:rgba(43,22,8,.9);border:1px solid rgba(245,197,66,.4);border-right:0;
  border-radius:10px 0 0 10px;padding:8px;color:#f5c542;font-size:11px;font-weight:800;
}

.top-pill{
  position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;
  display:flex;flex-direction:column;gap:6px;z-index:12;
}
.pill{
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:6px 12px;
  border-radius:20px;border:1px solid rgba(245,197,66,.3);font-size:11px;
  font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;width:fit-content;
}
.pill.timer{color:var(--accent);font-family:monospace;font-size:13px}

.controls{
  position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:12px;z-index:15;padding:0 10px;
}
.ctl{
  width:58px;height:58px;border-radius:18px;border:1px solid rgba(245,197,66,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#fff;background:rgba(30,16,8,.8);backdrop-filter:blur(10px);
}
.ctl:active{transform:scale(.92)}
.ctl.off{background:rgba(224,82,82,.25);border-color:var(--danger);color:#ff9e9e}
.ctl.hang{background:var(--danger);border-color:#ff8e8e}
.ctl-ic{font-size:22px;line-height:1}
.ctl-lb{font-size:9px;font-weight:800;text-transform:uppercase}

#toast{
  position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:#2b1608;border:1px solid var(--accent);color:#fff;padding:8px 16px;
  border-radius:12px;font-size:12px;font-weight:700;z-index:100;opacity:0;pointer-events:none;transition:.2s;
}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="nameModal" hidden>
  <div class="modal-box">
    <h2>स्वागत है!</h2>
    <p>कॉलिंग शुरू करने के लिए अपना नाम लिखें</p>
    <input id="nameInput" class="modal-input" placeholder="उदा. नीरज, राहुल..." maxlength="15">
    <button id="saveNameBtn" class="submit-btn">आगे बढ़ें</button>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="header">
    <div class="logo">📹 VIDEO CALL</div>
    <div class="user-badge" id="myBadge">👤 लोड हो रहा है...</div>
  </div>

  <div class="preview-card" id="previewWrap">
    <video id="previewVideo" autoplay playsinline muted></video>
    <div class="preview-hint" id="previewHint">कैमरा प्रिव्यू शुरू करने के लिए टैप करें</div>
  </div>

  <div class="contacts-wrap">
    <div class="section-title">उपलब्ध संपर्क (Contacts)</div>
    <div id="contactsList">
      <div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">संपर्क लोड हो रहे हैं...</div>
    </div>
  </div>
</div>

<div id="incomingDialog" class="call-dialog" hidden>
  <div style="text-align:center">
    <div class="caller-photo">👤</div>
    <div class="caller-title" id="incomingName">इनकमिंग वीडियो कॉल...</div>
    <div class="caller-subtitle">बात करने के लिए कॉल उठाएँ</div>
  </div>
  <div class="dialog-actions">
    <button class="circle-btn btn-reject" id="btnReject">
      <span class="ic">✕</span><span>काटें</span>
    </button>
    <button class="circle-btn btn-accept" id="btnAccept">
      <span class="ic">📞</span><span>उठाएँ</span>
    </button>
  </div>
</div>

<div id="outgoingDialog" class="call-dialog" hidden>
  <div style="text-align:center">
    <div class="caller-photo">📞</div>
    <div class="caller-title" id="outgoingName">कॉलिंग...</div>
    <div class="caller-subtitle">घंटी बज रही है...</div>
  </div>
  <button class="circle-btn btn-reject" id="btnCancelCall" style="width:74px;height:74px">
    <span class="ic">✕</span><span>रद्द करें</span>
  </button>
</div>

<div id="call" class="screen" hidden>
  <video id="remoteVideo" autoplay playsinline></video>
  <div id="remotePlaceholder">
    <div style="font-size:48px">⏳</div>
    <div style="font-size:15px;color:var(--accent);font-weight:800">कनेक्ट हो रहा है...</div>
  </div>

  <div class="pip-wrap" id="pipWrap">
    <video id="localVideo" autoplay playsinline muted></video>
    <button class="pip-hide" id="pipHide">›</button>
  </div>
  <button class="pip-show" id="pipShow" hidden>👤 आप</button>

  <div class="top-pill">
    <div class="pill"><span class="dot online"></span><span id="callUserTitle">कॉल कनेक्टेड</span></div>
    <div class="pill timer" id="callTimer">00:00</div>
  </div>

  <div class="controls">
    <button class="ctl" id="micBtn"><span class="ctl-ic" id="micIco">🎤</span><span class="ctl-lb">Mic</span></button>
    <button class="ctl" id="camBtn"><span class="ctl-ic" id="camIco">📹</span><span class="ctl-lb">Cam</span></button>
    <button class="ctl" id="speakerBtn"><span class="ctl-ic" id="speakerIco">🔊</span><span class="ctl-lb">Speaker</span></button>
    <button class="ctl" id="flipBtn"><span class="ctl-ic">🔄</span><span class="ctl-lb">Flip</span></button>
    <button class="ctl hang" id="hangBtn"><span class="ctl-ic">📞</span><span class="ctl-lb">End</span></button>
  </div>
</div>

<div id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, set, get, update, remove,
  onValue, onChildAdded, push, onDisconnect, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg1VC0cd1FmGiXTkMvFFG-eSL46FmgtZU",
  authDomain: "chess-e4910.firebaseapp.com",
  databaseURL: "https://chess-e4910-default-rtdb.firebaseio.com",
  projectId: "chess-e4910",
  storageBucket: "chess-e4910.firebasestorage.app",
  messagingSenderId: "62635884266",
  appId: "1:62635884266:web:0375748951994b26cb2193",
  measurementId: "G-WPMMGH247F"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ICE_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    {
      urls: 'turn:openrelay.metered.ca:80',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    }
  ]
};

const $ = id => document.getElementById(id);
const lobbyScreen = $('lobby'), callScreen =$('call');
const previewVideo = $('previewVideo'), previewHint =$('previewHint');
const contactsList = $('contactsList'), myBadge =$('myBadge');
const incomingDialog = $('incomingDialog'), outgoingDialog =$('outgoingDialog');
const localVideo = $('localVideo'), remoteVideo =$('remoteVideo');
const remotePlaceholder = $('remotePlaceholder');
const pipWrap = $('pipWrap'), pipShow =$('pipShow');
const callTimer = $('callTimer');

let myUserId = localStorage.getItem('vc_user_id') || '';
let myUserName = localStorage.getItem('vc_user_name') || '';
let localStream = null;
let pc = null;
let activeCallId = null;
let targetUserId = null;
let isCaller = false;
let callStartTime = 0;
let timerTimer = null;
let facingMode = 'user';
let micEnabled = true;
let camEnabled = true;
let speakerEnabled = true;
let unsubs = [];
let pendingCandidates = [];

let audioCtx = null;
function playTone(freq, duration, type='sine') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

let ringInterval = null;
function startRingtone() {
  if (ringInterval) return;
  playTone(480, 0.4);
  ringInterval = setInterval(() => {
    playTone(480, 0.4);
    setTimeout(() => playTone(440, 0.4), 450);
  }, 2200);
}
function stopRingtone() {
  if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function checkUser() {
  if (!myUserId || !myUserName) {
    $('nameModal').hidden = false;
  } else {
    $('nameModal').hidden = true;
    initPresence();
  }
}

$('saveNameBtn').onclick = () => {
  const val = $('nameInput').value.trim();
  if (!val) return;
  myUserName = val;
  myUserId = val.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Math.floor(100 + Math.random()*900);
  localStorage.setItem('vc_user_id', myUserId);
  localStorage.setItem('vc_user_name', myUserName);
  $('nameModal').hidden = true;
  initPresence();
};

async function initPresence() {
  myBadge.textContent = '👤 ' + myUserName;

  const userRef = ref(db, `users/${myUserId}`);
  await set(userRef, {
    id: myUserId,
    name: myUserName,
    online: true,
    lastSeen: serverTimestamp()
  });

  onDisconnect(userRef).update({ online: false, lastSeen: serverTimestamp() });
  onDisconnect(ref(db, `calls/${myUserId}`)).remove();

  onValue(ref(db, 'users'), (snap) => {
    const data = snap.val() || {};
    renderContacts(data);
  });

  listenForIncoming();
  ensureCamera();
}

function renderContacts(users) {
  contactsList.innerHTML = '';
  const userIds = Object.keys(users).filter(id => id !== myUserId);

  if (userIds.length === 0) {
    contactsList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">अन्य कोई संपर्क मौजूद नहीं है। दूसरे फ़ोन में यही पेज खोलें।</div>';
    return;
  }

  userIds.forEach(id => {
    const u = users[id];
    const isOnline = !!u.online;
    const card = document.createElement('div');
    card.className = 'contact-card';
    card.innerHTML = `
      <div class="contact-info">
        <div class="contact-avatar">${(u.name || 'U').charAt(0).toUpperCase()}</div>
        <div>
          <div class="contact-name">${u.name || 'User'}</div>
          <div class="contact-status">
            <span class="dot ${isOnline ? 'online' : ''}"></span>
            ${isOnline ? 'ऑनलाइन' : 'ऑफलाइन'}
          </div>
        </div>
      </div>
      <button class="call-btn" ${!isOnline ? 'style="opacity:0.4;cursor:not-allowed"' : ''}>
        📞 Call
      </button>
    `;
    const btn = card.querySelector('.call-btn');
    if (isOnline) {
      btn.onclick = () => startCall(id, u.name);
    }
    contactsList.appendChild(card);
  });
}

async function ensureCamera() {
  if (localStream) return localStream;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width:{ ideal:1280 }, height:{ ideal:720 } },
      audio: { echoCancellation:true, noiseSuppression:true }
    });
    previewVideo.srcObject = localStream;
    previewVideo.classList.add('on');
    previewHint.hidden = true;
    return localStream;
  } catch(e) {
    toast('कैमरा या माइक की अनुमति नहीं मिली');
    return null;
  }
}
$('previewWrap').onclick = ensureCamera;

function listenForIncoming() {
  const incomingRef = ref(db, `user_inbox/${myUserId}`);
  onValue(incomingRef, async (snap) => {
    const callData = snap.val();
    if (callData && callData.status === 'ringing') {
      activeCallId = callData.callId;
      targetUserId = callData.callerId;
      $('incomingName').textContent = (callData.callerName || 'कोई') + ' कॉल कर रहा है...';
      incomingDialog.hidden = false;
      startRingtone();
    } else if (callData && (callData.status === 'cancelled' || callData.status === 'ended')) {
      stopRingtone();
      incomingDialog.hidden = true;
      hangup(true);
    }
  });
}

async function startCall(remoteId, remoteName) {
  const ok = await ensureCamera();
  if (!ok) return;

  targetUserId = remoteId;
  activeCallId = `${myUserId}_${Date.now()}`;
  isCaller = true;

  $('outgoingName').textContent = remoteName + ' को कॉल हो रहा है...';
  outgoingDialog.hidden = false;
  startRingtone();

  await set(ref(db, `user_inbox/${targetUserId}`), {
    callId: activeCallId,
    callerId: myUserId,
    callerName: myUserName,
    status: 'ringing'
  });

  const callRef = ref(db, `active_sessions/${activeCallId}`);
  const unsubStatus = onValue(callRef, async (snap) => {
    const sess = snap.val();
    if (!sess) return;
    if (sess.status === 'accepted') {
      stopRingtone();
      outgoingDialog.hidden = true;
      unsubStatus();
      connectWebRTC();
    } else if (sess.status === 'rejected') {
      stopRingtone();
      outgoingDialog.hidden = true;
      toast('कॉल काट दी गई');
      hangup(true);
    }
  });
  unsubs.push(unsubStatus);
}

$('btnCancelCall').onclick = async () => {
  stopRingtone();
  outgoingDialog.hidden = true;
  if (targetUserId) {
    await update(ref(db, `user_inbox/${targetUserId}`), { status: 'cancelled' });
  }
  hangup();
};

$('btnAccept').onclick = async () => {
  stopRingtone();
  incomingDialog.hidden = false;
  const ok = await ensureCamera();
  if (!ok) return;

  incomingDialog.hidden = true;
  isCaller = false;

  await set(ref(db, `active_sessions/${activeCallId}`), {
    status: 'accepted',
    calleeId: myUserId
  });

  connectWebRTC();
};

$('btnReject').onclick = async () => {
  stopRingtone();
  incomingDialog.hidden = true;
  if (activeCallId) {
    await set(ref(db, `active_sessions/${activeCallId}`), { status: 'rejected' });
  }
  await remove(ref(db, `user_inbox/${myUserId}`));
};

async function connectWebRTC() {
  lobbyScreen.hidden = true;
  callScreen.hidden = false;
  localVideo.srcObject = localStream;
  remotePlaceholder.hidden = false;

  pc = new RTCPeerConnection(ICE_SERVERS);

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (e) => {
    const [stream] = e.streams;
    if (stream) {
      remoteVideo.srcObject = stream;
      remotePlaceholder.hidden = true;
      startTimer();
    }
  };

  const sessionPath = `active_sessions/${activeCallId}`;
  const myCandPath = isCaller ? 'callerCandidates' : 'calleeCandidates';
  const remoteCandPath = isCaller ? 'calleeCandidates' : 'callerCandidates';

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      push(ref(db, `${sessionPath}/${myCandPath}`), e.candidate.toJSON());
    }
  };

  onChildAdded(ref(db, `${sessionPath}/${remoteCandPath}`), async (snap) => {
    const cand = snap.val();
    if (cand) {
      try {
        if (!pc.remoteDescription) pendingCandidates.push(cand);
        else await pc.addIceCandidate(new RTCIceCandidate(cand));
      } catch(e){}
    }
  });

  if (isCaller) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await set(ref(db, `${sessionPath}/offer`), { sdp: offer.sdp, type: offer.type });

    onValue(ref(db, `${sessionPath}/answer`), async (snap) => {
      const ans = snap.val();
      if (ans && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(ans));
        flushCandidates();
      }
    });
  } else {
    onValue(ref(db, `${sessionPath}/offer`), async (snap) => {
      const offer = snap.val();
      if (offer && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        flushCandidates();
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await set(ref(db, `${sessionPath}/answer`), { sdp: answer.sdp, type: answer.type });
      }
    });
  }

  onValue(ref(db, `${sessionPath}/ended`), (snap) => {
    if (snap.val() === true) {
      toast('कॉल समाप्त हुई');
      hangup(true);
    }
  });
}

function flushCandidates() {
  while (pendingCandidates.length) {
    const c = pendingCandidates.shift();
    pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
  }
}

$('micBtn').onclick = () => {
  micEnabled = !micEnabled;
  localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
  $('micBtn').classList.toggle('off', !micEnabled);$('micIco').textContent = micEnabled ? '🎤' : '🚫';
};

$('camBtn').onclick = () => {
  camEnabled = !camEnabled;
  localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
  $('camBtn').classList.toggle('off', !camEnabled);$('camIco').textContent = camEnabled ? '📹' : '🚫';
  pipWrap.style.opacity = camEnabled ? '1' : '0.3';
};

$('speakerBtn').onclick = () => {
  speakerEnabled = !speakerEnabled;
  remoteVideo.muted = !speakerEnabled;
  $('speakerBtn').classList.toggle('off', !speakerEnabled);$('speakerIco').textContent = speakerEnabled ? '🔊' : '🔇';
};

$('flipBtn').onclick = async () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  try {
    localStream.getVideoTracks().forEach(t => t.stop());
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode } }, audio: false
    });
    const newTrack = newStream.getVideoTracks()[0];
    const oldTrack = localStream.getVideoTracks()[0];
    localStream.removeTrack(oldTrack);
    localStream.addTrack(newTrack);
    localVideo.srcObject = localStream;
    previewVideo.srcObject = localStream;
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) sender.replaceTrack(newTrack);
  } catch(e) { toast('कैमरा नहीं बदला जा सका'); }
};

$('hangBtn').onclick = () => hangup();

function hangup(silent = false) {
  stopRingtone();
  stopTimer();
  playTone(260, 0.25, 'triangle');

  if (activeCallId && !silent) {
    update(ref(db, `active_sessions/${activeCallId}`), { ended: true }).catch(()=>{});
  }
  if (targetUserId) {
    remove(ref(db, `user_inbox/${targetUserId}`)).catch(()=>{});
  }
  remove(ref(db, `user_inbox/${myUserId}`)).catch(()=>{});

  if (pc) { pc.close(); pc = null; }
  remoteVideo.srcObject = null;
  activeCallId = null;
  targetUserId = null;
  pendingCandidates = [];

  callScreen.hidden = true;
  incomingDialog.hidden = true;
  outgoingDialog.hidden = true;
  lobbyScreen.hidden = false;
}

function startTimer() {
  callStartTime = Date.now();
  if (timerTimer) clearInterval(timerTimer);
  timerTimer = setInterval(() => {
    const diff = Math.floor((Date.now() - callStartTime) / 1000);
    const m = String(Math.floor(diff / 60)).padStart(2, '0');
    const s = String(diff % 60).padStart(2, '0');
    callTimer.textContent = `${m}:${s}`;
  }, 1000);
}
function stopTimer() {
  if (timerTimer) { clearInterval(timerTimer); timerTimer = null; }
  callTimer.textContent = '00:00';
}

$('pipHide').onclick = () => { pipWrap.classList.add('hidden'); pipShow.hidden = false; };$('pipShow').onclick = () => { pipWrap.classList.remove('hidden'); pipShow.hidden = true; };

checkUser();
</script>
